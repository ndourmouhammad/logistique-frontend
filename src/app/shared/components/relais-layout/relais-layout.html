<div class="flex min-h-screen">

  <!-- Sidebar -->
  <aside class="w-50 bg-navy flex flex-col fixed top-0 left-0 h-full z-40">

    <!-- Logo -->
    <div class="px-4 py-3.5 border-b border-white/8 flex flex-col gap-1 items-start justify-center">
      <img src="logos/kolisgo-logo-dark.svg" alt="KolisGo" class="h-6">
      <div class="text-[10px] text-white/40">Point Relais</div>
    </div>

    <div class="px-3 pt-4 pb-1 text-[9px] font-medium tracking-widest uppercase text-white/30">Gestion</div>

    <!-- Menu -->
    <nav class="flex-1 px-2 space-y-0.5">
      <a routerLink="/relais/dashboard"
        [class]="active === 'dashboard'
          ? 'flex items-center gap-2.5 px-3 py-2 rounded-lg bg-white/10'
          : 'flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-white/5 transition'">
        <i [class]="active === 'dashboard' ? 'ti ti-layout-dashboard text-white text-base' : 'ti ti-layout-dashboard text-white/45 text-base'"></i>
        <span [class]="active === 'dashboard' ? 'text-xs text-white' : 'text-xs text-white/55'">Tableau de bord</span>
      </a>

      <a routerLink="/relais/reception"
        [class]="active === 'reception'
          ? 'flex items-center gap-2.5 px-3 py-2 rounded-lg bg-white/10'
          : 'flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-white/5 transition'">
        <i [class]="active === 'reception' ? 'ti ti-package text-white text-base' : 'ti ti-package text-white/45 text-base'"></i>
        <span [class]="active === 'reception' ? 'text-xs text-white' : 'text-xs text-white/55'">Réception colis</span>
      </a>

      <a routerLink="/relais/stock"
        [class]="active === 'stock'
          ? 'flex items-center gap-2.5 px-3 py-2 rounded-lg bg-white/10'
          : 'flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-white/5 transition'">
        <i [class]="active === 'stock' ? 'ti ti-building-warehouse text-white text-base' : 'ti ti-building-warehouse text-white/45 text-base'"></i>
        <span [class]="active === 'stock' ? 'text-xs text-white flex-1' : 'text-xs text-white/55 flex-1'">Mon stock</span>
        <span class="bg-tt-orange text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full">{{ nbStock }}</span>
      </a>

      <a routerLink="/relais/remise"
        [class]="active === 'remise'
          ? 'flex items-center gap-2.5 px-3 py-2 rounded-lg bg-white/10'
          : 'flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-white/5 transition'">
        <i [class]="active === 'remise' ? 'ti ti-hand-grab text-white text-base' : 'ti ti-hand-grab text-white/45 text-base'"></i>
        <span [class]="active === 'remise' ? 'text-xs text-white' : 'text-xs text-white/55'">Remise client</span>
      </a>

      <a routerLink="/relais/commissions"
        [class]="active === 'commissions'
          ? 'flex items-center gap-2.5 px-3 py-2 rounded-lg bg-white/10'
          : 'flex items-center gap-2.5 px-3 py-2 rounded-lg hover:bg-white/5 transition'">
        <i [class]="active === 'commissions' ? 'ti ti-cash text-white text-base' : 'ti ti-cash text-white/45 text-base'"></i>
        <span [class]="active === 'commissions' ? 'text-xs text-white' : 'text-xs text-white/55'">Commissions</span>
      </a>

    </nav>

    <!-- Profil + déconnexion -->
    <div class="border-t border-white/8 px-3 py-3">
      <!-- Infos utilisateur -->
      <a routerLink="/relais/profil" 
         class="flex items-center gap-2.5 mb-2 hover:bg-white/5 p-1.5 -mx-1.5 rounded-lg transition group"
         [class.bg-white_10]="active === 'profil'">
        <div class="w-7 h-7 rounded-full bg-tt-orange/30 flex items-center justify-center
                    text-tt-orange text-[10px] font-medium shrink-0">
          {{ userInitiales() }}
        </div>
        <div class="min-w-0 flex-1">
          <div class="text-[11px] font-medium text-white/70 truncate group-hover:text-white transition">{{ userNom() }}</div>
          <div class="text-[9px] text-white/30">Gérant relais</div>
        </div>
        <i class="ti ti-chevron-right text-white/20 group-hover:text-white/50 text-xs transition"></i>
      </a>

      <!-- Bouton déconnexion -->
      <button (click)="demanderConfirmation()"
        class="w-full flex items-center gap-2 px-2 py-1.5 rounded-lg
               hover:bg-red-500/10 transition group">
        <i class="ti ti-logout text-white/30 group-hover:text-red-400 text-sm"></i>
        <span class="text-[11px] text-white/30 group-hover:text-red-400">Se déconnecter</span>
      </button>
    </div>

  </aside>

  <!-- Contenu principal -->
  <div class="flex-1 ml-50 flex flex-col">
    <ng-content></ng-content>
  </div>

  <!-- Modal confirmation déconnexion -->
  @if (showConfirm()) {
    <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
        <div class="text-center mb-5">
          <div class="w-14 h-14 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-3">
            <i class="ti ti-logout text-2xl text-red-500"></i>
          </div>
          <h3 class="text-base font-bold text-slate-800">Se déconnecter ?</h3>
          <p class="text-sm text-slate-400 mt-1">
            Vous devrez vous reconnecter pour accéder à votre espace.
          </p>
        </div>
        <div class="flex gap-3">
          <button (click)="annulerDeconnexion()"
            class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl text-sm font-semibold">
            Annuler
          </button>
          <button (click)="confirmerDeconnexion()"
            class="flex-1 bg-red-500 text-white py-3 rounded-xl text-sm font-semibold">
            Déconnecter
          </button>
        </div>
      </div>
    </div>
  }

</div>
