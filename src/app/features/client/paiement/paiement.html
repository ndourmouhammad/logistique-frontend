<app-client-layout activeTab="dashboard">
  <div class="min-h-screen flex items-center justify-center bg-slate-50 px-4">
    <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-sm text-center">

      @if (isLoading()) {
        <div class="w-16 h-16 bg-orange-50 rounded-full flex items-center
                    justify-center mx-auto mb-5">
          <i class="ti ti-loader-2 animate-spin text-3xl text-tt-orange"></i>
        </div>
        <h2 class="text-lg font-bold text-slate-800 mb-2">
          Redirection vers PayTech...
        </h2>
        <p class="text-sm text-slate-400">
          Vous allez être redirigé vers la page de paiement sécurisée.<br>
          <span class="font-semibold text-navy">{{ montant() | number }} FCFA</span>
        </p>
      }

      @if (erreurMessage()) {
        <div class="w-16 h-16 bg-red-50 rounded-full flex items-center
                    justify-center mx-auto mb-5">
          <i class="ti ti-alert-circle text-3xl text-red-500"></i>
        </div>
        <h2 class="text-lg font-bold text-slate-800 mb-2">Erreur de paiement</h2>
        <p class="text-sm text-red-500 mb-6">{{ erreurMessage() }}</p>
        <a routerLink="/client/expedition"
          class="block w-full bg-navy text-white py-3.5 rounded-xl
                 text-sm font-semibold">
          Réessayer
        </a>
      }

    </div>
  </div>
</app-client-layout>
