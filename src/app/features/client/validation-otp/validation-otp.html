<app-client-layout activeTab="tracking">
  <div class="flex flex-col justify-center py-10 md:pb-0 h-full">
    <div class="max-w-md mx-auto px-4 w-full text-center">
      <!-- Header -->
      <div class="mb-8">
        <a routerLink="/client/tracking" class="inline-flex w-12 h-12 bg-navy rounded-2xl text-white font-bold text-lg items-center justify-center shadow-lg mb-4 cursor-pointer hover:bg-navy-light transition">TT</a>
        <h1 class="text-xl font-semibold text-slate-800">Votre colis est arrivé !</h1>
        <p class="text-sm text-slate-500 mt-2">Le livreur {{ nomLivreur }} est à votre adresse.</p>
      </div>

      <!-- OTP Card -->
      <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-6 mb-6">
        <div class="w-16 h-16 bg-orange-50 rounded-full flex items-center justify-center mx-auto mb-4">
          <i class="ti ti-lock-open text-2xl text-tt-orange"></i>
        </div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Code de validation</div>
        <div class="font-mono text-4xl font-bold text-navy tracking-[0.2em] mb-4">{{ otpCode }}</div>
        <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 text-xs text-slate-500 leading-relaxed">
          Communiquez ce code de sécurité à 4 chiffres au livreur pour valider la réception de votre colis.
        </div>
      </div>

      <!-- Delivery Details -->
      <div class="bg-white rounded-xl border border-slate-100 p-4 text-left mb-8">
        <div class="flex items-center justify-between mb-3 border-b border-slate-100 pb-3">
          <div class="text-sm font-semibold text-navy">Colis {{ codeTracking }}</div>
          <span class="bg-indigo-50 text-indigo-700 text-xs px-2 py-0.5 rounded-full">Vêtements</span>
        </div>
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center text-slate-500 font-medium">IB</div>
          <div class="flex-1">
            <div class="text-sm font-medium text-slate-800">{{ nomLivreur }}</div>
            <div class="text-xs text-slate-500">Livreur certifié Tiak-Tiak</div>
          </div>
          <button class="w-8 h-8 bg-green-50 rounded-lg flex items-center justify-center text-green-600"><i class="ti ti-phone text-sm"></i></button>
        </div>
      </div>

      <!-- Footer actions -->
      <div class="space-y-3">
        <button (click)="confirmerReception()" [disabled]="isLoading" class="w-full bg-navy text-white py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-lg shadow-navy/20 disabled:opacity-70 disabled:cursor-not-allowed transition cursor-pointer">
          <i class="ti" [ngClass]="isLoading ? 'ti-loader animate-spin' : 'ti-check'"></i> 
          {{ isLoading ? 'Validation...' : 'J\'ai reçu mon colis' }}
        </button>
        <button class="w-full bg-white text-slate-500 border border-slate-200 hover:bg-slate-50 py-3 rounded-xl text-sm font-medium transition cursor-pointer">
          Signaler un problème
        </button>
      </div>
    </div>
  </div>
</app-client-layout>
