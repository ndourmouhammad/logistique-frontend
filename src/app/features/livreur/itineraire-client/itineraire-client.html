<div class="h-screen flex flex-col bg-slate-200 relative overflow-hidden">

  <!-- Fausse carte en fond -->
  <div class="absolute inset-0 z-0">
    <svg class="w-full h-full" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <rect width="100%" height="100%" fill="#e8edf2"/>
      <path d="M 50 100 L 200 150 L 150 400 L 300 600" fill="none" stroke="#ffffff" stroke-width="12"/>
      <path d="M 50 100 L 200 150 L 150 400 L 300 600" fill="none" stroke="#F97316" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="300" cy="600" r="10" fill="#1A2E4A" stroke="white" stroke-width="3"/>
    </svg>
  </div>

  <!-- Top bar Navigation Info -->
  <div class="relative z-10 p-4">
    <div class="bg-navy text-white rounded-2xl shadow-xl flex items-center overflow-hidden">
      <div class="bg-white/10 p-4 flex items-center justify-center">
        <i class="ti ti-arrow-bear-right text-3xl"></i>
      </div>
      <div class="p-4 flex-1">
        <div class="text-xl font-bold">150 m</div>
        <div class="text-sm text-white/80">Avenue Cheikh Anta Diop</div>
      </div>
      <a routerLink="/livreur/dashboard" class="p-4 cursor-pointer hover:bg-white/10 transition">
        <i class="ti ti-x text-white/50 text-xl"></i>
      </a>
    </div>
  </div>

  <!-- Marqueur livreur sur la carte -->
  <div class="flex-1 relative z-10 pointer-events-none">
    <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-auto">
      <div class="w-12 h-12 bg-white rounded-full shadow-lg flex items-center justify-center relative">
        <div class="absolute inset-0 bg-tt-orange rounded-full animate-ping opacity-20"></div>
        <i class="ti ti-motorbike text-2xl text-tt-orange -rotate-45"></i>
      </div>
    </div>
  </div>

  <!-- Bottom Panel -->
  <div class="relative z-10 bg-white rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.1)]">
    <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto my-3"></div>
    <div class="px-6 pb-8">
      <div class="flex justify-between items-end mb-4">
        <div>
          <div class="text-3xl font-bold text-navy">{{ duree }} <span class="text-base font-medium text-slate-400">min</span></div>
          <div class="text-sm font-medium text-slate-500">{{ distance }} · Arrivée {{ eta }}</div>
        </div>
        <div class="font-mono text-xs font-semibold text-slate-400 border border-slate-200 px-2 py-1 rounded">#{{ codeColis }}</div>
      </div>

      <div class="bg-slate-50 border border-slate-100 rounded-2xl p-4 flex items-center gap-3 mb-5">
        <div class="w-10 h-10 bg-indigo-50 text-indigo-700 rounded-full flex items-center justify-center">
          <i class="ti ti-user text-xl"></i>
        </div>
        <div class="flex-1">
          <div class="text-sm font-semibold text-slate-800">{{ nomClient }}</div>
          <div class="text-xs text-slate-500">{{ adresseClient }}</div>
        </div>
        <button class="w-10 h-10 bg-green-50 text-green-600 rounded-xl flex items-center justify-center shadow-sm">
          <i class="ti ti-phone text-lg"></i>
        </button>
      </div>

      <div class="flex gap-2">
        <button (click)="jesuisArrive()" class="flex-1 bg-navy text-white py-4 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-lg shadow-navy/20 active:scale-95 transition-transform cursor-pointer">
          <i class="ti ti-map-pin-check"></i> Je suis arrivé
        </button>
        <button class="w-14 bg-red-50 text-red-600 rounded-xl flex items-center justify-center border border-red-100 shadow-sm active:scale-95 transition-transform cursor-pointer">
          <i class="ti ti-alert-triangle text-xl"></i>
        </button>
      </div>
    </div>
  </div>

</div>
