<!-- Radar animation in background -->
<div class="fixed inset-0 bg-slate-900 flex items-center justify-center p-4 z-0">
  <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
    <div class="absolute w-[300px] h-[300px] bg-tt-orange rounded-full animate-ping" style="animation-duration:3s"></div>
    <div class="absolute w-[200px] h-[200px] bg-tt-orange rounded-full animate-ping" style="animation-duration:3s; animation-delay:0.5s"></div>
    <div class="absolute w-[100px] h-[100px] bg-tt-orange rounded-full"></div>
  </div>

  <div class="w-full max-w-sm bg-white rounded-3xl overflow-hidden shadow-2xl relative z-10">
    <!-- Header -->
    <div class="bg-tt-orange p-5 text-center text-white relative">
      <div class="absolute top-3 right-3 text-xs font-mono bg-black/20 px-2 py-1 rounded">{{ countdown }}s</div>
      <i class="ti ti-bell-ringing text-4xl mb-2 animate-bounce block"></i>
      <h2 class="text-xl font-bold">Nouvelle course !</h2>
      <p class="text-sm text-white/80 mt-1">À {{ distance }} km de votre position</p>
    </div>

    <!-- Details -->
    <div class="p-5">
      <div class="flex justify-between items-center mb-4">
        <span class="bg-orange-50 text-orange-700 text-[10px] font-bold px-2.5 py-1 rounded uppercase tracking-wide">Ramassage Client</span>
        <span class="font-semibold text-lg text-slate-800">{{ montant | number }} FCFA</span>
      </div>

      <div class="flex gap-3 mb-4">
        <div class="flex flex-col items-center mt-1">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
          <div class="w-0.5 h-6 bg-slate-200"></div>
          <div class="w-2.5 h-2.5 rounded-full border-2 border-slate-300 bg-white"></div>
        </div>
        <div class="flex-1 space-y-3">
          <div>
            <div class="text-xs text-slate-400">Point d'enlèvement</div>
            <div class="text-sm font-medium text-slate-800">{{ adresseEnlevement }}</div>
          </div>
          <div>
            <div class="text-xs text-slate-400">Dépôt</div>
            <div class="text-sm font-medium text-slate-800">{{ adresseDepot }}</div>
          </div>
        </div>
      </div>

      <div class="bg-slate-50 border border-slate-100 rounded-xl p-3 flex gap-4 text-center mb-6">
        <div class="flex-1">
          <div class="text-xs text-slate-400">Distance</div>
          <div class="text-sm font-semibold">~{{ distance }} km</div>
        </div>
        <div class="w-px bg-slate-200"></div>
        <div class="flex-1">
          <div class="text-xs text-slate-400">Poids est.</div>
          <div class="text-sm font-semibold">{{ poids }} kg</div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex gap-3">
        <button (click)="refuser()" class="w-14 h-14 bg-slate-100 text-slate-600 rounded-2xl flex items-center justify-center hover:bg-slate-200 active:bg-slate-200 transition cursor-pointer">
          <i class="ti ti-x text-2xl"></i>
        </button>
        <button (click)="accepter()" class="flex-1 bg-navy text-white text-base font-semibold rounded-2xl flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-lg shadow-navy/30 cursor-pointer">
          <i class="ti ti-check"></i> Accepter
        </button>
      </div>
    </div>
  </div>
</div>
