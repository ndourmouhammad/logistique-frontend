<div class="min-h-screen bg-navy flex flex-col relative overflow-hidden">

  <!-- Arrière-plan décoratif -->
  <div class="absolute inset-0 pointer-events-none">
    <div class="absolute top-[-10%] right-[-20%] w-[400px] h-[400px] bg-linear-to-br from-tt-orange/15 to-transparent rounded-full blur-3xl"></div>
    <div class="absolute bottom-[-10%] left-[-15%] w-[350px] h-[350px] bg-linear-to-tr from-blue-500/10 to-transparent rounded-full blur-3xl"></div>
  </div>

  <!-- Skip -->
  <div class="flex justify-end p-6 relative z-10">
    <button (click)="skip()" class="text-white/40 text-sm hover:text-white/70 transition">
      Passer <i class="ti ti-arrow-right ml-1"></i>
    </button>
  </div>

  <!-- Slide content -->
  <div class="flex-1 flex flex-col items-center justify-center px-8 relative z-10">

    <!-- Icône -->
    <div class="w-24 h-24 bg-linear-to-br from-orange-400 to-orange-600 rounded-3xl flex items-center justify-center shadow-2xl shadow-orange-500/30 mb-8 fade-up">
      <i [class]="'ti ' + slides[currentSlide].icon + ' text-white text-5xl'"></i>
    </div>

    <!-- Logo -->
    <div class="flex items-center gap-3 mb-8 fade-up">
      <div class="w-10 h-10 bg-linear-to-br from-orange-400 to-orange-600 rounded-xl flex items-center justify-center text-white font-bold">TT</div>
      <span class="text-white font-semibold text-lg">Tiak-Tiak</span>
    </div>

    <!-- Texte -->
    <h1 class="text-3xl font-bold text-white text-center leading-tight mb-4 fade-up">
      {{ slides[currentSlide].title }}
    </h1>
    <p class="text-white/50 text-center text-sm leading-relaxed max-w-xs fade-up">
      {{ slides[currentSlide].description }}
    </p>
  </div>

  <!-- Dots + Bouton -->
  <div class="px-8 pb-12 relative z-10">

    <!-- Indicateurs -->
    <div class="flex justify-center gap-2 mb-8">
      <button
        *ngFor="let slide of slides; let i = index"
        (click)="goToSlide(i)"
        [class]="i === currentSlide
          ? 'w-6 h-2 bg-tt-orange rounded-full transition-all duration-300'
          : 'w-2 h-2 bg-white/30 rounded-full transition-all duration-300'">
      </button>
    </div>

    <!-- Bouton suivant -->
    <button
      (click)="next()"
      class="btn-press w-full bg-tt-orange text-white py-4 rounded-2xl font-semibold text-base flex items-center justify-center gap-2 shadow-lg shadow-orange-500/30">
      {{ currentSlide < slides.length - 1 ? 'Suivant' : 'Commencer' }}
      <i class="ti ti-arrow-right"></i>
    </button>

    <!-- Connexion -->
    <p class="text-center text-white/40 text-sm mt-4">
      Déjà un compte ?
      <a routerLink="/connexion" class="text-tt-orange font-semibold hover:underline">Se connecter</a>
    </p>
  </div>
</div>
