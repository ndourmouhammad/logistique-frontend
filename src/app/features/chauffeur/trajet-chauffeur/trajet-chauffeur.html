<div class="h-screen flex flex-col bg-[#0f1f35] relative overflow-hidden text-white">

  <ng-container *ngIf="hasActiveTrajet; else pasDeTrajet">
    <!-- Fausse carte en fond (Dark Mode) -->
    <div class="absolute inset-0 z-0">
      <svg class="w-full h-full" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
        <!-- Grid patterns or routes -->
        <path d="M 0 150 L 400 150 M 0 350 L 400 350" stroke="#1e3a5a" stroke-width="2"/>
        <path d="M 120 0 L 120 800 M 300 0 L 300 800" stroke="#1e3a5a" stroke-width="2"/>
        
        <!-- Route -->
        <path d="M 50 700 Q 80 500 120 400 Q 200 200 300 50" fill="none" stroke="#1e3a5a" stroke-width="14" stroke-linecap="round"/>
        <path d="M 50 700 Q 80 500 120 400 Q 200 200 300 50" fill="none" stroke="#F97316" stroke-width="6" stroke-dasharray="10,6" opacity="0.9"/>
        
        <!-- Hub Destination -->
        <circle cx="300" cy="50" r="12" fill="#3730A3" stroke="white" stroke-width="3"/>
      </svg>
    </div>

    <!-- Top bar Navigation Info -->
    <div class="relative z-10 p-4 pt-10">
      <div class="bg-navy/90 backdrop-blur-md border border-white/10 rounded-2xl shadow-2xl flex items-center overflow-hidden">
        <div class="bg-navy-dark p-4 flex items-center justify-center"><i class="ti ti-arrow-bear-right text-3xl text-tt-orange"></i></div>
        <div class="p-4 flex-1">
          <div class="text-lg font-bold">{{ instructionNav }}</div>
          <div class="text-xs text-white/70">Trajet en cours</div>
        </div>
        <div class="p-4 text-right">
          <div class="text-lg font-bold text-tt-orange">{{ nbColis }}</div>
          <div class="text-[10px] text-white/60">colis</div>
        </div>
      </div>
    </div>

    <div class="flex-1 relative z-10 pointer-events-none">
      <!-- Marqueur camion sur la carte -->
      <div class="absolute top-1/2 left-[38%] -translate-x-1/2 -translate-y-1/2 pointer-events-auto">
        <div class="relative">
          <div class="absolute inset-0 bg-tt-orange rounded-full animate-ping opacity-30 w-16 h-16 -left-4 -top-4"></div>
          <div class="w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center relative border-2 border-tt-orange">
            <i class="ti ti-truck-delivery text-xl text-tt-orange transform -rotate-12"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Bottom Panel -->
    <div class="relative z-10 bg-white text-slate-800 rounded-t-3xl shadow-[0_-10px_30px_rgba(0,0,0,0.3)] pb-24">
      <div class="w-12 h-1 bg-slate-200 rounded-full mx-auto my-3"></div>
      <div class="px-5 pb-5">
        
        <div class="bg-navy rounded-xl p-4 flex justify-between items-center mb-4 text-white">
          <div>
            <div class="text-[10px] text-white/60 uppercase">Destination</div>
            <div class="text-sm font-bold">{{ prochainHub }}</div>
          </div>
          <div class="bg-tt-orange/20 text-tt-orange px-3 py-1 rounded-lg text-xs font-bold">
            {{ nbColis }} colis
          </div>
        </div>

        <div class="flex gap-2">
          <button (click)="declarerArrivee()" class="flex-1 bg-navy text-white py-3.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-lg shadow-navy/20 active:scale-95 transition-transform"><i class="ti ti-map-pin"></i> Déclarer arrivée au hub</button>
          <button (click)="activerSOS()" [class.bg-red-500]="sosActive" [class.text-white]="sosActive" class="w-14 bg-red-50 text-red-600 rounded-xl flex items-center justify-center border border-red-100 shadow-sm active:scale-95 transition-transform"><i class="ti ti-alert-triangle text-xl"></i></button>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #pasDeTrajet>
    <div class="flex-1 flex flex-col items-center justify-center p-6 text-center pb-24 z-10 bg-[#0f1f35]">
      <div class="w-24 h-24 bg-navy-dark rounded-full flex items-center justify-center mb-6 shadow-xl border border-white/10">
        <i class="ti ti-route-off text-5xl text-white/40"></i>
      </div>
      <h2 class="text-2xl font-bold mb-2">Aucun trajet en cours</h2>
      <p class="text-white/60 mb-8">Vous n'avez aucune expédition en transit actuellement.</p>
      
      <button routerLink="/chauffeur/feuille-route" class="bg-tt-orange text-white px-8 py-3.5 rounded-xl font-bold shadow-lg shadow-tt-orange/30 active:scale-95 transition-transform flex items-center gap-2">
        <i class="ti ti-clipboard-list text-xl"></i>
        Voir la feuille de route
      </button>
    </div>
  </ng-template>


</div>

<app-chauffeur-layout active="carte"></app-chauffeur-layout>
