<app-chauffeur-layout active="profil">
  <div class="bg-slate-50 min-h-screen pb-24">

    <div class="bg-navy text-white px-4 pt-10 pb-6 text-center relative overflow-hidden">
      <div class="absolute inset-0 pointer-events-none">
        <div class="absolute top-[-20%] right-[-20%] w-[200px] h-[200px] bg-tt-orange/10 rounded-full blur-3xl"></div>
      </div>
      <div class="relative z-10">
        <div class="w-20 h-20 bg-tt-orange rounded-full flex items-center justify-center
                    text-white text-2xl font-bold mx-auto mb-3 shadow-lg shadow-orange-500/30">
          {{ initiales() }}
        </div>
        <h1 class="text-lg font-bold">{{ nomComplet() }}</h1>
        <span class="text-xs text-white/50 bg-white/10 px-3 py-1 rounded-full mt-1 inline-block">
          Chauffeur · Tiak-Tiak
        </span>
      </div>
    </div>

    <div class="px-4 py-6 space-y-4">

      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <div class="px-4 py-3 border-b border-slate-50">
          <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Informations du compte</h2>
        </div>
        <div class="divide-y divide-slate-50">
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-8 h-8 bg-slate-100 rounded-lg flex items-center justify-center shrink-0">
              <i class="ti ti-user text-slate-500"></i>
            </div>
            <div>
              <div class="text-[10px] text-slate-400">Nom complet</div>
              <div class="text-sm font-medium text-slate-800">{{ nomComplet() }}</div>
            </div>
          </div>
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-8 h-8 bg-slate-100 rounded-lg flex items-center justify-center shrink-0">
              <i class="ti ti-truck text-slate-500"></i>
            </div>
            <div>
              <div class="text-[10px] text-slate-400">Rôle</div>
              <div class="text-sm font-medium text-slate-800">Chauffeur inter-hub</div>
            </div>
          </div>
          <div class="flex items-center gap-3 px-4 py-3.5">
            <div class="w-8 h-8 bg-emerald-50 rounded-lg flex items-center justify-center shrink-0">
              <i class="ti ti-circle-check text-emerald-500"></i>
            </div>
            <div>
              <div class="text-[10px] text-slate-400">Statut</div>
              <div class="text-sm font-medium text-emerald-600">Disponible</div>
            </div>
          </div>
        </div>
      </div>

      <div class="text-center text-[10px] text-slate-300">Tiak-Tiak v1.0 · Chauffeur</div>

      <button (click)="demanderConfirmation()"
        class="w-full bg-red-50 border border-red-100 text-red-600 py-3.5 rounded-2xl
               text-sm font-semibold flex items-center justify-center gap-2
               hover:bg-red-100 transition active:scale-95">
        <i class="ti ti-logout"></i>
        Se déconnecter
      </button>
    </div>

    @if (showConfirm()) {
      <div class="fixed inset-0 bg-black/50 z-[100] flex items-end justify-center p-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl pb-8">
          <div class="text-center mb-5">
            <div class="w-14 h-14 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-3">
              <i class="ti ti-logout text-2xl text-red-500"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800">Se déconnecter ?</h3>
            <p class="text-sm text-slate-400 mt-1">Vous devrez vous reconnecter pour accéder à votre espace.</p>
          </div>
          <div class="flex gap-3">
            <button (click)="annulerDeconnexion()"
              class="flex-1 bg-slate-100 text-slate-700 py-3 rounded-xl text-sm font-semibold">
              Annuler
            </button>
            <button (click)="confirmerDeconnexion()"
              class="flex-1 bg-red-500 text-white py-3 rounded-xl text-sm font-semibold">
              Déconnecter
            </button>
          </div>
        </div>
      </div>
    }

  </div>
</app-chauffeur-layout>
