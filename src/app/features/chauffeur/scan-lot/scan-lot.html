<div class="bg-slate-900 h-screen flex flex-col text-white">

  <!-- Header -->
  <div class="bg-slate-900 px-4 pt-6 pb-4 flex items-center gap-3 z-10 border-b border-white/10">
    <a routerLink="/chauffeur/feuille-route" class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center shrink-0"><i class="ti ti-arrow-left text-xl"></i></a>
    <div class="flex-1">
      <div class="flex items-center gap-2">
        <h1 class="font-bold text-base">Scanner lot</h1>
        <!-- Mode Hors-Ligne (PWA) -->
        <span *ngIf="modeHorsLigne" class="bg-slate-700/80 text-white/90 text-[9px] uppercase tracking-widest font-bold px-1.5 py-0.5 rounded border border-slate-500/50 flex items-center gap-1"><i class="ti ti-wifi-off text-[10px]"></i> Hors-Ligne</span>
      </div>
      <p class="text-xs text-white/50">{{ hubNom }} · Chargement</p>
    </div>
    <div class="bg-white/10 rounded-lg px-2.5 py-1 text-xs font-bold text-emerald-400 border border-emerald-500/30">
      {{ colisCharges }}/{{ totalColis }}
    </div>
  </div>

  <!-- Camera Area -->
  <div class="flex-1 relative flex flex-col items-center justify-center bg-black overflow-hidden">
    <!-- Camera feed placeholder -->
    <div class="absolute inset-0 opacity-40 bg-[url('https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?q=80&w=600&auto=format&fit=crop')] bg-cover bg-center"></div>
    
    <!-- Cadre de scan -->
    <div class="relative w-64 h-64 mb-8 z-10">
      <div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-tt-orange rounded-tl-xl"></div>
      <div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-tt-orange rounded-tr-xl"></div>
      <div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-tt-orange rounded-bl-xl"></div>
      <div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-tt-orange rounded-br-xl"></div>
      <div class="absolute top-1/2 left-4 right-4 h-0.5 bg-tt-orange shadow-[0_0_10px_#F97316] animate-pulse"></div>
    </div>
    
    <div class="z-10 bg-black/60 backdrop-blur-md px-4 py-2 rounded-full text-xs font-medium text-white/80 border border-white/10">
      Centrez le QR Code ou Code-barres
    </div>
  </div>

  <!-- Bottom Panel -->
  <div class="bg-slate-900 rounded-t-3xl px-4 py-6 border-t border-white/10 relative z-20 pb-24">
    <!-- Feedback -->
    <div *ngIf="dernierScan" class="bg-emerald-500/10 border border-emerald-500/20 rounded-xl p-3 flex items-center gap-3 mb-4">
      <i class="ti ti-circle-check text-emerald-500 text-xl"></i>
      <div class="text-sm font-medium text-emerald-400">{{ dernierScan }} — Chargé <i class="ti ti-check"></i></div>
    </div>
    
    <div class="flex justify-between items-center mb-3">
      <h3 class="text-sm font-semibold">Colis chargés ({{ colisCharges }}/{{ totalColis }})</h3>
      <div class="w-20 h-1.5 bg-white/10 rounded-full overflow-hidden">
        <div class="h-full bg-tt-orange rounded-full" [style.width]="progression + '%'"></div>
      </div>
    </div>

    <!-- Liste -->
    <div class="space-y-1 mb-5 max-h-32 overflow-y-auto pr-2 custom-scrollbar">
      <div *ngFor="let c of colis; let last = last" class="flex items-center gap-3 py-2" [class.border-b]="!last" [class.border-white]="!last" [class.border-opacity-5]="!last">
        <ng-container *ngIf="c.charge">
          <div class="w-6 h-6 bg-emerald-500/20 text-emerald-500 rounded flex items-center justify-center shrink-0"><i class="ti ti-check text-xs"></i></div>
          <div class="font-mono text-sm">{{ c.code }}</div>
          <div class="ml-auto text-xs text-white/50">→ {{ c.destination }}</div>
        </ng-container>
        <ng-container *ngIf="!c.charge">
          <div class="w-6 h-6 bg-white/5 text-white/40 rounded flex items-center justify-center shrink-0"><i class="ti ti-dots text-xs"></i></div>
          <div class="font-mono text-sm text-white/40">{{ c.code }}</div>
          <div class="ml-auto text-xs text-white/40">En attente</div>
        </ng-container>
      </div>
    </div>

    <div class="flex gap-3">
      <button class="flex-[2] bg-tt-orange text-white py-3.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 active:scale-95 transition-transform"><i class="ti ti-player-play"></i> Continuer scan</button>
      <button class="flex-1 border border-white/20 text-white py-3.5 rounded-xl text-sm font-medium active:bg-white/5 transition-colors">Manuel</button>
    </div>
    
    <button (click)="validerEtDemarrer()" class="mt-3 w-full bg-emerald-600 text-white py-3.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-lg shadow-emerald-600/20"><i class="ti ti-truck"></i> Valider et démarrer trajet</button>
  </div>

</div>

<app-chauffeur-layout active="scanner" [darkMode]="true"></app-chauffeur-layout>
